<div class="container py-4">
  <h1 class="mb-4">Plantilla funciones simple</h1>

  <div class="row g-2 align-items-end mb-4">
    <div class="col-md-6">
      <label for="funcion" class="form-label">Selecciona una función</label>
      <select
        #funcionSelect
        id="funcion"
        class="form-select"
        [(ngModel)]="funcionesSeleccionadas"
        name="selectedFunciones"
        multiple
        size="3"
      >
        @for (funcion of arrayFunciones; track funcion) {
          <option [value]="funcion">
            {{ funcion }}
          </option>
        }
      </select>
    </div>
    <div class="col-md-auto">
      <button
        class="btn btn-primary"
        type="button"
        (click)="buscarPlantilla()"
      >
        Mostrar plantilla
      </button>
    </div>
  </div>

  @if (arrayEmpleados.length > 0) {
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th scope="col">Apellido</th>
            <th scope="col">Función</th>
            <th scope="col">Turno</th>
            <th scope="col">Salario</th>
          </tr>
        </thead>
        <tbody>
          @for (empleado of arrayEmpleados; track empleado) {
            <tr>
              <td>{{ empleado.apellido }}</td>
              <td>{{ empleado.funcion }}</td>
              <td>{{ empleado.turno }}</td>
              <td>{{ empleado.salario }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
